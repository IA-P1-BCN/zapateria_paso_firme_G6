# T-022 · Despliegue en Render (plan gratuito).
#
# AVISO: en el plan gratuito de Render los servicios se DUERMEN tras 15 minutos sin peticiones.
# La primera petición después tarda en contestar mientras el servidor se levanta
# (unos 30-60 s la tienda y hasta 1-2 min n8n). No es un error: hay que esperar y recargar.
# No se añade nada que los mantenga despiertos (ni pings ni tareas programadas activas).
#
# Los valores marcados con "sync: false" son secretos: se rellenan a mano en el panel de Render,
# nunca en este fichero. Ver la sección "Despliegue en la nube" del README.

services:
  # App de la tienda. Sus datos están en SQLite dentro del contenedor y Render gratis no tiene disco
  # permanente: cada vez que el servicio se duerme o se reinicia vuelve a los datos de ejemplo (SEED=1).
  - type: web
    name: paso-firme-tienda
    runtime: docker
    plan: free
    region: frankfurt
    branch: dev
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "8000"
      - key: TZ
        value: Europe/Madrid
      - key: SEED
        value: "1"
      # La app se la pasa al navegador (/config.js): usar una clave solo para esta demo.
      - key: API_KEY
        sync: false
      # Cuando n8n esté desplegado (ver abajo), descomentar para que la tienda le avise:
      # - key: N8N_WEBHOOK_URL       # https://<servicio de n8n>.onrender.com/webhook/tienda
      #   sync: false
      # - key: WEBHOOK_TOKEN         # el mismo valor que en n8n (T-020)
      #   sync: false

  # PENDIENTE: n8n con su base de datos en Neon (Postgres que escala a cero). Se decidirá si se usa Neon;
  # mientras tanto el bloque queda comentado. Para desplegarlo, descomentarlo entero y seguir los pasos
  # de "n8n en la nube (pendiente)" en el README. Probado en local: n8n 2.44.4 arranca contra Neon.
