services:
  tienda:
    build: .
    ports:
      - "8000:8000"
    environment:
      - TZ=Europe/Madrid
      - DB_PATH=/data/tienda.db
      - API_KEY=${API_KEY}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - WEBHOOK_TOKEN=${WEBHOOK_TOKEN:-}
      - SEED=${SEED:-1}
    volumes:
      - tienda_data:/data

  n8n:
    image: docker.n8n.io/n8nio/n8n
    ports:
      - "5678:5678"
    environment:
      - TZ=Europe/Madrid
      - GENERIC_TIMEZONE=Europe/Madrid
      # n8n 2.x bloquea $env en los nodos por defecto; los flujos leen aquí su configuración
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - EMAIL_TIENDA=${EMAIL_TIENDA:-}
      - UMBRAL_VENTA_GRANDE=${UMBRAL_VENTA_GRANDE:-80}
      - TELEGRAM_CHAT_ID_MARISA=${TELEGRAM_CHAT_ID_MARISA:-}
      # URL pública/base de n8n que usan los flujos para construir enlaces (p. ej. confirmar-solicitud)
      - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL:-http://localhost:5678}
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  tienda_data:
  n8n_data:
